[project]
name = "elt-bench-tinker"
version = "0.1.0"
description = "Execution-verified ELT-Bench reinforcement learning with Tinker"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "PyYAML>=6",
  "sqlglot>=28,<31",
  "snowflake-connector-python[pandas]>=3.12,<4",
  "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@df2aff6b3992c7bd5dddece2397093f95dd5aed3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elt_tinker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
